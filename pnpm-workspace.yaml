packages:
  - apps/*
  - packages/*

# pnpm 10 не запускает install-скрипты зависимостей без явного разрешения.
# Prisma скачивает свои движки (в т.ч. schema-engine для migrate deploy) именно в postinstall.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - '@swc/core'
