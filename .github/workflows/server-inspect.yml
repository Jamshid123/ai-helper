name: Server inspect (read-only)

# Ручной запуск: Actions → "Server inspect (read-only)" → Run workflow.
# Только читает состояние сервера, ничего не меняет. Нужен перед первичной настройкой,
# чтобы не задеть уже работающие на сервере проекты.
# Секреты: SERVER_HOST, SERVER_ROOT_PASSWORD (временный, удалить после настройки сервера).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          [ -n "$HOST" ] || { echo "::error::Нет секрета SERVER_HOST (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$SSHPASS" ] || { echo "::error::Нет секрета SERVER_ROOT_PASSWORD"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Record host key fingerprint
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          echo "Host key (сверить и закрепить для деплоя):"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Inspect
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "root@$HOST" 'bash -s' <<'REMOTE'
          set +e
          section() { echo; echo "===== $1 ====="; }

          section "OS / resources"
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          echo "CPU: $(nproc)"; free -h | head -2; df -h / | tail -1
          uptime

          section "Listening TCP ports"
          ss -tlnpH | awk '{print $4, $6}' | sort -u

          section "Services"
          for s in nginx caddy apache2 haproxy traefik postgresql redis-server docker fail2ban ufw; do
            printf '%-14s %s\n' "$s" "$(systemctl is-active $s 2>/dev/null || echo n/a)"
          done
          ufw status 2>/dev/null | head -20

          section "Docker"
          docker --version 2>/dev/null; docker compose version 2>/dev/null
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' 2>/dev/null
          docker compose ls 2>/dev/null
          docker network ls --format '{{.Name}} {{.Driver}}' 2>/dev/null

          section "Reverse proxy (имена хостов, без содержимого конфигов)"
          if command -v nginx >/dev/null; then
            nginx -v 2>&1
            ls /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null
            grep -rhoE 'server_name[^;]+' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | sort -u
            ls /etc/letsencrypt/live 2>/dev/null
          fi
          if command -v caddy >/dev/null; then
            caddy version
            grep -hoE '^[a-zA-Z0-9.*:-]+\s*\{' /etc/caddy/Caddyfile 2>/dev/null
          fi
          docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | grep -iE 'nginx|caddy|traefik|proxy'

          section "PostgreSQL"
          command -v psql >/dev/null && psql --version
          if systemctl is-active -q postgresql 2>/dev/null; then
            sudo -u postgres psql -Atc "show server_version;" 2>/dev/null
            sudo -u postgres psql -Atc "show listen_addresses;" 2>/dev/null
            echo "Databases:"; sudo -u postgres psql -Atc "select datname from pg_database where not datistemplate;" 2>/dev/null
          fi
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null | grep -iE 'postgres|redis'

          section "Databases: all containers (incl. stopped) / volumes"
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' 2>/dev/null | grep -iE 'postgres|mysql|maria|mongo|redis|clickhouse' || echo "no DB containers"
          docker volume ls --format '{{.Name}}' 2>/dev/null | grep -iE 'pg|postgres|mysql|maria|mongo|redis|data|db' || true
          ls -d /var/lib/postgresql /var/lib/mysql /var/lib/mongodb /opt/*/data /opt/*/postgres* 2>/dev/null

          section "ai-helper-postgres: who uses it"
          docker inspect ai-helper-postgres --format 'created={{.Created}} restart={{.HostConfig.RestartPolicy.Name}} compose_project={{index .Config.Labels "com.docker.compose.project"}} compose_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null
          # только имена переменных и несекретные значения (USER/DB), пароль не выводим
          docker inspect ai-helper-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E '^POSTGRES_(USER|DB)=' || true
          docker network inspect ai-helper-net --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null
          PGU=$(docker inspect ai-helper-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^POSTGRES_USER=//p'); PGU=${PGU:-postgres}
          echo "Databases (name | size):"
          docker exec ai-helper-postgres psql -U "$PGU" -d postgres -Atc "select datname || ' | ' || pg_size_pretty(pg_database_size(datname)) from pg_database where not datistemplate order by 1;" 2>&1 | head -30
          echo "Roles:"
          docker exec ai-helper-postgres psql -U "$PGU" -d postgres -Atc "select rolname || case when rolsuper then ' (superuser)' else '' end from pg_roles where rolname !~ '^pg_' order by 1;" 2>&1 | head -30
          echo "Active connections per DB:"
          docker exec ai-helper-postgres psql -U "$PGU" -d postgres -Atc "select coalesce(datname,'-') || ' | ' || count(*) from pg_stat_activity group by datname order by datname;" 2>&1 | head -20

          section "MySQL"
          mysql --version 2>/dev/null; systemctl is-active mysql 2>/dev/null
          # root через unix-socket (auth_socket) — только список баз и размеры
          mysql -N -e "select table_schema, round(sum(data_length+index_length)/1024/1024,1) as mb from information_schema.tables group by table_schema order by 1;" 2>&1 | head -30
          mysql -N -e "select user, host from mysql.user order by 1;" 2>&1 | head -30

          section "SSH config"
          sshd -T 2>/dev/null | grep -E '^(port|permitrootlogin|passwordauthentication|pubkeyauthentication) '
          getent passwd deploy >/dev/null && echo "user deploy exists" || echo "user deploy absent"
          REMOTE
