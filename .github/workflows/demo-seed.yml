name: Demo seed

# Только вручную (Run workflow): заводит тестовые лоты на демо-стенде.
# Скрипт сам откажется, если DEMO_STAND не включён или в базе уже есть идущие/запланированные лоты.
# Секреты: SERVER_HOST, DEPLOY_SSH_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SSH setup
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$HOST" ] && [ -n "$KEY" ] || { echo "::error::Нужны секреты SERVER_HOST и DEPLOY_SSH_KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 10 -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          printf 'Host srv\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config

      - name: Seed demo lots
        run: |
          ssh srv "set -e; cd /opt/auksion
            docker compose --env-file .env --env-file .deploy.env run --rm --no-deps api node dist/scripts/seed-demo.js"
