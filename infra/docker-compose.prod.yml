# Прод/демо-стенд AuksionGO на сервере: /opt/auksion/docker-compose.yml
# Запуск: docker compose --env-file .env --env-file .deploy.env up -d
# .env (секреты, создаётся bootstrap, chmod 600) · .deploy.env (TAG текущей версии, пишет deploy)
name: auksion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auksion
      POSTGRES_USER: auksion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    # Наружу порт не публикуется: доступ только из сети db (позже — сервис api).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auksion -d auksion']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    image: auksion-api:${TAG:?TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://auksion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/auksion
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://auksion.expertly.uz,https://auksion-admin.expertly.uz
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      # Демо-стенд: разрешает имитацию оплаты и тестовые лоты (задаёт deploy.yml). На боевом запуске — false.
      DEMO_STAND: ${DEMO_STAND:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      # read-only контейнер: Prisma не пишет кэш/телеметрию
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['127.0.0.1:3400:3000']
    # default — для публикации порта на 127.0.0.1 (во внутренних сетях Docker порты не публикует)
    networks: [db, internal, default]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  miniapp:
    image: auksion-miniapp:${TAG:?TAG is required}
    restart: unless-stopped
    ports: ['127.0.0.1:3401:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  db:
    internal: true
  internal:
    internal: true

volumes:
  pgdata:
