# Стенды AuksionGO на сервере (решение 17.11.2026: dev + prod), один файл для обоих:
#   dev  — /opt/auksion,      проект «auksion»,      порты 3400–3402, dev.auksiongo.uz (выкладка — мерж в main)
#   prod — /opt/auksion-prod, проект «auksion-prod», порты 3403–3405, auksiongo.uz (выкладка — Deploy prod)
# Запуск: docker compose [-p auksion-prod] --env-file .env --env-file .deploy.env up -d
# .env (секреты, создаётся на сервере, chmod 600) · .deploy.env (TAG версии и настройки стенда, пишет workflow)
# Тома и сети у каждого проекта свои (префикс — имя проекта).
name: auksion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auksion
      POSTGRES_USER: auksion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    # Наружу порт не публикуется: доступ только из сети db (позже — сервис api).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auksion -d auksion']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    image: auksion-api:${TAG:?TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://auksion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/auksion
      REDIS_URL: redis://redis:6379
      # Адреса стенда (пишет workflow в .deploy.env); по умолчанию — старые адреса демо-стенда.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://auksion.expertly.uz,https://auksion-admin.expertly.uz}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      # SMS-код входа: disabled — вход закрыт (по умолчанию); fake — только демо-стенд (код показывается на экране)
      SMS_MODE: ${SMS_MODE:-disabled}
      # Демо-стенд: разрешает имитацию оплаты и тестовые лоты (задаёт deploy.yml). На боевом запуске — false.
      DEMO_STAND: ${DEMO_STAND:-false}
      # Платёжные системы (решение 17.11.2026): ключи — в .env на сервере; пустые = система не подключена.
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_TEST_MODE: ${PAYME_TEST_MODE:-false}
      PUBLIC_SITE_URL: ${SITE_URL:-https://auksion.expertly.uz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      # read-only контейнер: Prisma не пишет кэш/телеметрию
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # фото товаров (решение 14.11.2026: диск сервера); при восстановлении сервера — переносить вместе с pgdata
    volumes:
      - media:/data/media
    ports: ['127.0.0.1:${API_PORT:-3400}:3000']
    # default — для публикации порта на 127.0.0.1 (во внутренних сетях Docker порты не публикует)
    networks: [db, internal, default]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  miniapp:
    image: auksion-miniapp:${TAG:?TAG is required}
    restart: unless-stopped
    ports: ['127.0.0.1:${SITE_PORT:-3401}:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  admin:
    image: auksion-admin:${TAG:?TAG is required}
    restart: unless-stopped
    ports: ['127.0.0.1:${ADMIN_PORT:-3402}:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  db:
    internal: true
  internal:
    internal: true

volumes:
  pgdata:
  media:
