# Статика SPA внутри контейнера (nginx-unprivileged, порт 8080, без root).
# TLS и домены — на reverse proxy хоста.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # FRAME_ANCESTORS подставляется при сборке образа: Mini App встраивается в Telegram Web, админка — никуда.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors __FRAME_ANCESTORS__; base-uri 'self'; form-action 'self'" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors __FRAME_ANCESTORS__; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }

  # API — тот же origin (CSP connect-src 'self', без CORS). Имя «api» резолвится при запросе (DNS Docker),
  # поэтому nginx стартует и там, где API нет (сборка образа, админка до появления API).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
